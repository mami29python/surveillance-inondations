<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surveillance des inondations - Dakar</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #ef4444;
            --vigilance: #f59e0b;
            --normal: #22c55e;
            --hors-ligne: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .update-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .alert-banner {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 20px;
            border-left: 5px solid var(--danger);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .filter-btn.active {
            background: #0f172a;
            color: white;
            border-color: #0f172a;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .zone-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .zone-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .zone-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-danger { background: #fee2e2; color: var(--danger); }
        .badge-vigilance { background: #fef3c7; color: var(--vigilance); }
        .badge-normal { background: #dcfce7; color: var(--normal); }
        .badge-hors-ligne { background: #f1f5f9; color: var(--hors-ligne); }

        .metric {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .metric span {
            font-size: 1rem;
            font-weight: normal;
            color: var(--text-muted);
        }

        .zone-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 15px;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }

        .table-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }

        th {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Surveillance des inondations</h1>
            <div class="update-time" id="lastUpdate">Actualisé à --:--:--</div>
        </header>

        <div id="alertBanner" class="alert-banner" style="display: none;">
            Alerte danger détectée sur certaines zones !
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filtrer('Tous')">Tous</button>
            <button class="filter-btn" onclick="filtrer('Normal')">Normal</button>
            <button class="filter-btn" onclick="filtrer('Vigilance')">Vigilance</button>
            <button class="filter-btn" onclick="filtrer('Danger')">Danger</button>
            <button class="filter-btn" onclick="filtrer('Hors ligne')">Hors ligne</button>
        </div>

        <div class="grid" id="zonesGrid">
            <!-- Les cartes s'injectent ici dynamiquement -->
        </div>

 <div class="table-section">
            <h3 id="tableTitle">Derniers relevés</h3>
            <table>
                <thead>
                    <tr>
                        <th>Heure</th>
                        <th>Niveau d'eau</th>
                        <th>État</th>
                    </tr>
                </thead>
                <tbody id="historiqueTable">
                    <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Sélectionnez une zone pour voir les détails</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let zonesGlobalData = {};
        let zoneActive = "Thiaroye"; // Zone affichée par défaut dans le tableau// Zone affichée par défaut dans le tableau

        async function fetchData() {
            try {
                const response = await fetch('/api/zones');
                zonesGlobalData = await response.json();
                renderDashboard();
                document.getElementById('lastUpdate').innerText = "Actualisé à " + new Date().toLocaleTimeString();
            } catch (e) {
                console.error("Erreur de récupération", e);
            }
        }

       function renderDashboard() {
            const grid = document.getElementById('zonesGrid');
            grid.innerHTML = "";
            let dangerDetected = false;

            for (let key in zonesGlobalData) {
                const z = zonesGlobalData[key];
                if (z.statut === "Danger") dangerDetected = true;

                let badgeClass = "badge-normal";
                if (z.statut === "Danger") badgeClass = "badge-danger";
                if (z.statut === "Vigilance") badgeClass = "badge-vigilance";
                if (z.statut === "Hors ligne") badgeClass = "badge-hors-ligne";

                grid.innerHTML += `
                    <div class="zone-card" onclick="changerZone('${key}')" style="cursor: pointer;">
                        <div class="zone-header">
                            <div>
                                <h3 class="zone-title">${z.nom}</h3>
                                <span class="zone-sub">${z.quartier}</span>
                            </div>
                            <span class="badge ${badgeClass}">${z.statut}</span>
                        </div>
                        <div class="metric">${z.niveauEau} <span>cm</span></div>
                        
                        <!-- Mini-courbe d'évolution -->
                        <div style="margin: 15px 0 10px 0;">
                            <svg width="100%" height="30" viewBox="0 0 300 30" preserveAspectRatio="none">
                                <path d="M 0 25 Q 75 22, 150 24 T 300 20" fill="none" stroke="${z.statut === 'Danger' ? 'var(--danger)' : 'var(--vigilance)'}" stroke-width="2" stroke-dasharray="4,4"/>
                            </svg>
                        </div>

                        <div class="zone-footer">
                            <span>Batterie ${z.batterie} %</span>
                            <span>Signal ${z.signal}</span>
                            <span>${z.heure}</span>
                        </div>
                    </div>
                `;
            }

            const banner = document.getElementById('alertBanner');
            banner.style.display = dangerDetected ? "block" : "none";

            updateTable();
        }

        function changerZone(key) {
            zoneActive = key;
            updateTable();
        }

        function updateTable() {
            const z = zonesGlobalData[zoneActive];
            if (!z) return;
            document.getElementById('tableTitle').innerText = `Relevés : ${z.nom} (${z.quartier})`;
            const tbody = document.getElementById('historiqueTable');
            
            if (!z.historique || z.historique.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Aucune mesure enregistrée pour le moment</td></tr>`;
                return;
            }

            tbody.innerHTML = z.historique.map(h => `
                <tr>
                    <td>${h.heure}</td>
                    <td>${h.niveau} cm</td>
                    <td><span class="badge ${h.statut === 'Danger' ? 'badge-danger' : h.statut === 'Vigilance' ? 'badge-vigilance' : 'badge-normal'}">${h.statut}</span></td>
                </tr>
            `).join('');
        }

        // Actualisation automatique toutes les 2 secondes
        setInterval(fetchData, 2000);
        fetchData();
    </script>
</body>
</html>
